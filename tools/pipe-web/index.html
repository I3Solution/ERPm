<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERPm Pipe</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--mut:#6b7587;--card:#fff;--bd:#dde1e8;--acc:#2563eb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--fg:#e6e9ef;--mut:#98a1b3;--card:#1b2029;--bd:#2c3441;--acc:#6ea0ff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:16px;margin:0}nav button,.chip{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:4px 10px;cursor:pointer}
nav button.on{border-color:var(--acc);color:var(--acc)}input{flex:1;min-width:180px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px 16px}@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--acc)}.mut{color:var(--mut);font-size:12px}.tag{font-size:11px;border-radius:6px;padding:1px 6px;border:1px solid var(--bd);margin-right:4px}
.Done{color:var(--ok)}.Doing{color:var(--acc)}.Blocked{color:var(--bad)}.Todo{color:var(--warn)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.col h3{font-size:12px;margin:0 0 6px;color:var(--mut)}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12.5px/1.5 ui-monospace,Consolas,monospace}
.stat{display:inline-block;margin-right:16px}.stat b{font-size:18px;display:block}
</style></head><body>
<header><h1>ERPm Pipe</h1>
<nav><button data-v="tasks" class="on">Ticket</button><button data-v="board">Theo stage</button><button data-v="lessons">Bài học</button></nav>
<input id="q" placeholder="Tìm từ khóa (BE#87, treasury, i18n key…)" ><button class="chip" id="re">Nạp lại</button></header>
<main><section id="list"></section><section id="detail" class="card" style="cursor:default"><span class="mut">Chọn một ticket để xem.</span></section></main>
<script>
const $=s=>document.querySelector(s);let view='tasks';
const api=async p=>(await fetch(p)).json();
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const card=t=>`<div class="card" data-f="${esc(t.file)}"><b>${esc(t.title)}</b><div class="mut"><span class="tag ${esc(t.status)}">${esc(t.status||'?')}</span>${t.stage?`<span class="tag">${esc(t.stage)}</span>`:''}${t.gate&&t.gate!=='none'?`<span class="tag">gate ${esc(t.gate)}</span>`:''}${t.features_total?` · ${t.features_done}/${t.features_total} feature`:''}${t.tokens_k?` · ${t.tokens_k}k tok`:''}${t.minutes?` · ${t.minutes} phút`:''}</div>${t.prsha?`<div class="mut">${esc(t.prsha)}</div>`:''}${t.snip?`<div class="mut">${esc(t.snip)}</div>`:''}</div>`;
async function stats(){const s=await api('/api/stats');return `<div class="card" style="cursor:default"><span class="stat"><b>${s.piped.n||0}</b>ticket qua /pipe</span><span class="stat"><b>${s.piped.tok||0}k</b>token (đã ghi)</span><span class="stat"><b>${s.piped.min||0}</b>phút (đã ghi)</span><span class="stat">${s.byStatus.map(x=>`<span class="tag ${esc(x.k)}">${esc(x.k||'?')} ${x.n}</span>`).join('')}</span><div class="mut">Chỉ cộng ô Metrics đã có số; "?" tính 0.</div></div>`}
async function render(){const q=$('#q').value.trim();let h='';
 if(q.startsWith('?')){const r=await api('/api/ask?q='+encodeURIComponent(q.slice(1)));h=r.error?'<span class="mut">Chỉ mục RAG đang dựng ('+r.chunks+' đoạn), thử lại sau.</span>':r.map(x=>'<div class="card"><b>'+x.score+' · '+x.source+'</b> <span class="mut">'+x.section+'</span><pre style="white-space:pre-wrap">'+x.text.replace(/</g,'&lt;')+'</pre></div>').join('');}
 else if(q){const r=await api('/api/search?q='+encodeURIComponent(q));h=r.length?r.map(card).join(''):'<span class="mut">Không có kết quả.</span>';}
 else if(view==='tasks'){h=await stats()+(await api('/api/tasks')).map(card).join('');}
 else if(view==='board'){const t=(await api('/api/tasks')).filter(x=>x.stage);const st=['BA','TA','DESIGN','DEV','TEST','REPORT'];h='<div class="board">'+st.map(s=>`<div class="col"><h3>${s} (${t.filter(x=>x.stage===s).length})</h3>${t.filter(x=>x.stage===s).map(card).join('')}</div>`).join('')+'</div>';}
 else{h=(await api('/api/lessons')).map(l=>`<div class="card" data-f="${esc(l.file)}"><b>${esc(l.title)}</b><pre>${esc(l.lesson)}</pre></div>`).join('')||'<span class="mut">Chưa có bài học.</span>';}
 $('#list').innerHTML=h;}
$('#list').onclick=async e=>{const c=e.target.closest('[data-f]');if(!c)return;const t=await api('/api/task?file='+encodeURIComponent(c.dataset.f));$('#detail').innerHTML=`<div class="mut">${esc(t.file)}</div><pre>${esc(t.body)}</pre>`;};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render();});
let tm;$('#q').oninput=()=>{clearTimeout(tm);tm=setTimeout(render,250)};
$('#re').onclick=async()=>{await api('/api/reindex');render();};render();
</script></body></html>
