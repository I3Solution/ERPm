name: Aggregate Task Status

on:
  pull_request_target:
    types: [closed]
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-status-aggregation-master
  cancel-in-progress: false

jobs:
  aggregate:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref != 'automation/task-status-aggregation'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild and open or update status PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          readonly BRANCH="automation/task-status-aggregation"
          readonly TITLE="chore: refresh aggregated task status"
          readonly BODY="$(cat <<'EOF'
          This PR updates `.ai/status.md` from the latest task records on `master`.

          - Generated by the **Aggregate Task Status** GitHub Actions workflow.
          - The report is a full snapshot, not a per-PR delta.
          - Do not edit the generated report manually.
          - This PR follows the repository's normal branch protection and review rules.
          EOF
          )"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Aggregation attempt ${attempt}/3"
            git fetch origin master
            git checkout -B status-aggregation origin/master

            python tools/progress/generate_status.py

            if git diff --quiet -- .ai/status.md; then
              echo "Task status report is already up to date."
              existing_pr="$(gh pr list --repo "$GH_REPO" --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')"
              if [[ -n "$existing_pr" ]]; then
                gh pr close "$existing_pr" --repo "$GH_REPO" --comment "The generated report is already up to date with master."
              fi
              exit 0
            fi

            git add .ai/status.md
            git commit -m "[docs] Regenerate aggregated task status"

            # This branch is exclusively owned by this workflow. The lease prevents
            # overwriting a concurrent update made after the remote SHA was read.
            expected_remote_sha="$(git ls-remote --heads origin "$BRANCH" | awk '{print $1}')"
            if git push --force-with-lease="refs/heads/$BRANCH:$expected_remote_sha" origin "HEAD:refs/heads/$BRANCH"; then
              existing_pr="$(gh pr list --repo "$GH_REPO" --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')"
              if [[ -n "$existing_pr" ]]; then
                gh pr edit "$existing_pr" --repo "$GH_REPO" --title "$TITLE" --body "$BODY"
                echo "Updated status PR #$existing_pr."
              else
                gh pr create --repo "$GH_REPO" --base master --head "$BRANCH" --title "$TITLE" --body "$BODY"
                echo "Created status aggregation PR."
              fi
              exit 0
            fi

            echo "Automation branch changed concurrently; refreshing master and retrying."
          done

          echo "Unable to publish task status PR after 3 attempts." >&2
          exit 1
