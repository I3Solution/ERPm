name: Verify ERPm
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_verification_only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ERPM_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci_verification_only
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify shared dictionaries
        run: cmp ERPm-FE/src/assets/i18n/system.json ERPm-BE/src/ERPm.Infrastructure/Persistence/Seeders/system_dictionary.json
      - run: dotnet build ERPm-BE/ERPm.sln
      - run: dotnet run --project ERPm-BE/tests/ERPm.Hrm.Verification --no-build
      - run: dotnet run --project ERPm-BE/tests/ERPm.Verification --no-build
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ERPm-FE/package-lock.json
      - run: npm ci
        working-directory: ERPm-FE
      - run: npm run build
        working-directory: ERPm-FE
      - run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: ERPm-FE
        env:
          CHROME_BIN: /usr/bin/google-chrome

  code-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend indexer dependencies
        run: npm ci --prefix tools/frontend-code-indexer
      - name: Test frontend indexer worker
        run: npm test --prefix tools/frontend-code-indexer
      - name: Build code index CLI
        run: dotnet build tools/ERPm.CodeIndex/ERPm.CodeIndex.csproj
      - name: Run code index unit tests
        run: dotnet test tests/ERPm.CodeIndex.Tests/ERPm.CodeIndex.Tests.csproj
      - name: Validate pinned workspace manifest
        run: dotnet run --project tools/ERPm.CodeIndex -- workspace status
      - name: Index pinned frontend application Program
        run: dotnet run --project tools/ERPm.CodeIndex -- index repo erpm-fe
      - name: Query indexed frontend symbol
        run: dotnet run --project tools/ERPm.CodeIndex -- find symbol PartnerService | grep -m 1 '"kind":"definition".*"name":"PartnerService"'
      - name: Query indexed frontend API evidence
        run: dotnet run --project tools/ERPm.CodeIndex -- find symbol getPartnerById | grep -m 1 '"kind":"api".*"urlKind":"interpolated"'
